<article class="product-card"><a class="product-image" href="{{ url_for('main.listing_detail', listing_id=listing.id) }}">{% if listing.images %}<img src="{{ url_for('uploaded_file', filename=listing.images[0].filename) }}" alt="{{ listing.title }}" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0">{% else %}<span class="image-placeholder">{{ listing.category.name[:1] }}</span>{% endif %}<span class="status-pill">{{ listing.status }}</span></a><div class="product-info"><small>{{ listing.category.name }}</small><a class="product-title" href="{{ url_for('main.listing_detail', listing_id=listing.id) }}">{{ listing.title }}</a><div class="price-row"><strong>₱{{ '%.2f'|format(listing.price) }}</strong>{% if listing.negotiable %}<span>Negotiable</span>{% endif %}</div><div class="product-meta"><span>{{ listing.condition }}</span><span>@{{ listing.seller.username }}</span></div></div></article>
